<div class="container mt-4">
  <h2>Mis Resultados de Exámenes</h2>
  <p>Aquí puedes consultar el historial de tus resultados médicos.</p>
  <hr>

  <div *ngIf="isLoading" class="text-center mt-5">
    <p>Cargando resultados...</p>
  </div>

  <div *ngIf="!isLoading && errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && !errorMessage && resultados.length > 0; else noResultados" class="accordion" id="accordionResultados">
    <div *ngFor="let resultado of resultados; let i = index" class="accordion-item">
      <h2 class="accordion-header" [id]="'heading' + i">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" [attr.data-bs-target]="'#collapse' + i" aria-expanded="false" [attr.aria-controls]="'collapse' + i">
          <strong>{{ resultado.tipoExamen }}</strong> - <span class="ms-2 text-muted">{{ resultado.fecha | date:'longDate' }}</span>
        </button>
      </h2>
      <div [id]="'collapse' + i" class="accordion-collapse collapse" [attr.aria-labelledby]="'heading' + i" data-bs-parent="#accordionResultados">
        <div class="accordion-body">
          <p>{{ resultado.resultado }}</p>
          <div *ngIf="resultado.archivoUrl">
            <a [href]="resultado.archivoUrl" target="_blank" class="btn btn-sm btn-outline-primary">
              Descargar Resultado Completo (PDF)
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noResultados>
    <div *ngIf="!isLoading && !errorMessage" class="text-center mt-5">
      <h4>No tienes resultados de exámenes disponibles.</h4>
    </div>
  </ng-template>
</div>
