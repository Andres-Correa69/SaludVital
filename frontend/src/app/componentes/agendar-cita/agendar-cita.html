<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h3>Agendar Nueva Cita</h3>
    </div>
    <div class="card-body">
      <form (ngSubmit)="onAgendarCita()">
        <div class="form-group mb-3">
          <label for="especialidad">Especialidad</label>
          <select id="especialidad" class="form-select" [(ngModel)]="nuevaCita.especialidad" name="especialidad" required>
            <option value="" disabled>Selecciona una especialidad</option>
            <option *ngFor="let esp of especialidades" [value]="esp">{{ esp }}</option>
          </select>
        </div>

        <div class="form-group mb-3">
          <label for="fecha">Fecha y Hora</label>
          <input type="datetime-local" id="fecha" class="form-control" [(ngModel)]="nuevaCita.fecha" name="fecha" required>
        </div>

        <div class="form-group mb-3">
          <label for="descripcion">Motivo o Síntomas (opcional)</label>
          <textarea id="descripcion" class="form-control" [(ngModel)]="nuevaCita.descripcion" name="descripcion" rows="4"></textarea>
        </div>

        <div *ngIf="successMessage" class="alert alert-success">
          {{ successMessage }}
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger">
          {{ errorMessage }}
        </div>

        <div class="d-flex justify-content-end">
          <a routerLink="/lista-citas" class="btn btn-secondary me-2">Cancelar</a>
          <button type="submit" class="btn btn-primary">Confirmar Cita</button>
        </div>
      </form>
    </div>
  </div>
</div>
